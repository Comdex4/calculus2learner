<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calc 2 Learner</title>
  <meta name="description" content="Learn Calculus 2 (plus the Calc 1 and trig you need) with interactive lessons, infinite practice problems, hints and step-by-step solutions.">
  <meta name="theme-color" content="#f7f7fb">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // apply saved theme before first paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem('calc2learner.theme');
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = (t === 'dark' || t === 'midnight') ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/"><span class="brand-mark">∫</span><span class="brand-text">Calc 2 <b>Learner</b></span></a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot muted small">Works offline · progress saved in your browser</div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu"></button>
        <span class="grow"></span>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>

  <noscript><p style="padding:2rem">Calc 2 Learner needs JavaScript enabled.</p></noscript>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/expr.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/core/graph.js"></script>
  <script src="js/gen/base.js"></script>
  <script src="js/gen/foundations.js"></script>
  <script src="js/gen/calc1.js"></script>
  <script src="js/gen/techniques.js"></script>
  <script src="js/gen/applications.js"></script>
  <script src="js/gen/series.js"></script>
  <script src="js/gen/polar-bridge.js"></script>
  <script src="js/content/course.js"></script>
  <script src="js/content/u-foundations.js"></script>
  <script src="js/content/u-calc1.js"></script>
  <script src="js/content/u-calc2.js"></script>
  <script src="js/content/u-series.js"></script>
  <script src="js/content/reference.js"></script>
  <script src="js/ui/shell.js"></script>
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/problem.js"></script>
  <script src="js/ui/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
